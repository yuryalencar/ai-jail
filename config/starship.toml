add_newline = false
format = """[AI-JAIL](bold red)$env_var $directory$git_branch$git_status$nodejs$python$cmd_duration$time
$character"""

[env_var.AI_JAIL_PROJECT]
default = ""
format = "[ · $env_value](bold yellow)"

[time]
disabled = false
format = "[ $time]($style)"
style = "dimmed white"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold magenta"

[git_status]
style = "yellow"

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow) "
