add_newline = false
format = """[AI-JAIL](bold red) $directory$git_branch$git_status$nodejs$python$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold magenta"

[git_status]
style = "yellow"

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow) "
